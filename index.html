<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trainer Dreiecke und Vierecke</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout wie Trainer Prozentrechnung: Levelspiel an Deck des Piratenschiffs. Startseite = Level-Pfad (Schatzkarten-Weg), Spielfeld = weiße Aufgabenkarte */
:root{
  color-scheme:dark;
  --holz1:#3a2414; --holz2:#2e1c10; --holz3:#24160c;
  --text:#ffffff; --leise:#ecd9b8; --glas:rgba(255,255,255,.08); --glasrand:rgba(255,255,255,.22);
  --gold:#ffd54a; --goldd:#f29a00; --gruen:#14a394; --gruend:#0a6b61;
  --karte:#ffffff; --tinte:#111111; --ok:#1b7a3e; --okbg:#e3f5e9; --err:#b3261e; --errbg:#fdecea;
  --dunkel:#3b2412;
  --font:Arial,"Liberation Sans",Helvetica,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--holz2)}
body{margin:0;min-height:100vh;color:var(--text);font-family:var(--font);font-size:18px;line-height:1.45;
  background:
   radial-gradient(700px 380px at 90% -5%,rgba(255,190,90,.30) 0%,transparent 60%),
   radial-gradient(600px 360px at 5% 105%,rgba(20,184,166,.20) 0%,transparent 60%),
   repeating-linear-gradient(0deg,rgba(0,0,0,.38) 0 3px,transparent 3px 66px),
   repeating-linear-gradient(90deg,rgba(255,255,255,.022) 0 2px,transparent 2px 11px),
   linear-gradient(180deg,var(--holz1) 0%,var(--holz2) 55%,var(--holz3) 100%);background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 28px}
#himmel{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.schule{font-size:.75rem;letter-spacing:.14em;color:var(--leise)}
h1{margin:2px 0 0;font-size:clamp(1.7rem,4.5vw,2.5rem);line-height:1.1}
h1 span{color:var(--gold)}
.zaehler{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.25);border-radius:999px;padding:7px 16px;font-weight:700;font-size:1.2rem;font-variant-numeric:tabular-nums;transition:transform .25s}
.zaehler svg{width:28px;height:28px}
.zaehlwerk{display:flex;gap:10px;flex-wrap:wrap}
.bonus{display:inline-flex;align-items:center;gap:3px;font-size:.85rem;font-weight:700;color:var(--dunkel);background:#ffe98a;border-radius:999px;padding:2px 9px}
.topf{display:flex;align-items:center;gap:6px;justify-content:center;color:var(--dunkel);font-size:.95rem}
.topf i{width:16px;height:16px;border-radius:50%;border:2px solid #f2a900;display:inline-block}
.topf i.voll{background:#ffd23f}
.topf svg{width:30px;height:30px}
.mflug{position:fixed;left:50%;top:45%;width:200px;height:200px;margin:-100px 0 0 -100px;z-index:50;pointer-events:none;perspective:600px}
.mflug svg{width:100%;height:100%;filter:drop-shadow(0 0 22px rgba(255,213,74,.9))}
.zaehler.puls{transform:scale(1.25);box-shadow:0 0 30px rgba(255,213,74,.7)}
.sub{color:#f3e6cf;margin:0}
#app{display:flex;flex-direction:column;gap:18px}
/* Level-Pfad (gestrichelter Weg wie auf einer Schatzkarte) */
.levels{position:relative;display:flex;flex-direction:column;gap:20px;padding-left:66px}
.levels:before{content:"";position:absolute;left:28px;top:36px;bottom:36px;border-left:4px dashed rgba(217,71,43,.8)}
.lv{position:relative;border-radius:20px;padding:16px 20px;background:var(--glas);border:1.5px solid var(--glasrand)}
.lv .badge{position:absolute;left:-66px;top:14px;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.5rem;background:#6b4426;border:3px solid rgba(255,255,255,.35)}
.lv.aktiv{background:linear-gradient(135deg,rgba(255,213,74,.16),rgba(20,184,166,.14));border:2px solid var(--gold);box-shadow:0 0 40px rgba(255,213,74,.22)}
.lv.aktiv .badge{background:var(--gold);color:var(--dunkel);border-color:#fff}
.lv.zu{opacity:.62}
.lvkopf{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.tag{font-size:.8rem;letter-spacing:.18em;color:var(--gold);font-weight:700}
.lvkopf h2{margin:2px 0 0;font-size:1.45rem;text-wrap:balance}
.lv.zu h2{color:#e8d6bd}
.klein{font-size:.85rem;color:var(--leise)}
.zahl{display:flex;align-items:center;gap:6px;color:#f7ecd9;font-size:.95rem}
.zahl svg{width:20px;height:20px}
.bahn{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:16px}
.bahn .linie{position:absolute;left:12.5%;right:12.5%;top:41px;height:6px;border-radius:3px;background:rgba(255,255,255,.2)}
.bahn .linie i{display:block;height:100%;border-radius:3px;background:var(--gold)}
.node{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;min-width:0}
.kreis{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;font-weight:800;background:#6b4426;border:4px solid rgba(255,255,255,.3);color:#fff;padding:0;cursor:pointer}
.node.fertig .kreis{background:radial-gradient(circle at 35% 30%,#ffe98a,#f5b400);color:#5a3b00;border-color:#fff3c4}
.node.jetzt .kreis{background:#fff;color:var(--dunkel);border-color:var(--gold);box-shadow:0 0 0 8px rgba(255,213,74,.25),0 0 30px rgba(255,213,74,.7);animation:puls 2s ease-in-out infinite}
.node.zu .kreis{background:#3a2616;color:#b39a7a;cursor:not-allowed}
@keyframes puls{50%{box-shadow:0 0 0 14px rgba(255,213,74,.12),0 0 40px rgba(255,213,74,.9)}}
.node b{font-size:1rem}
.sterne{display:flex;gap:3px}
.sterne svg{width:28px;height:28px}
.btn{font:inherit;cursor:pointer;border:0;background:var(--gruen);color:#fff;font-weight:800;font-size:1rem;border-radius:999px;padding:9px 22px;box-shadow:0 5px 0 var(--gruend);touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gruend)}
.btn.hell{background:rgba(255,255,255,.14);box-shadow:0 5px 0 rgba(0,0,0,.35)}
.btn.gold{background:var(--gold);color:var(--dunkel);box-shadow:0 5px 0 #b88a00}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.boss{background:linear-gradient(135deg,rgba(220,60,60,.22),rgba(255,213,74,.10));border:1.5px dashed rgba(255,120,120,.7)}
.boss .badge{background:#7a1f2b}
.boss.aktiv{border:2px solid #ff7a7a;box-shadow:0 0 40px rgba(255,90,90,.3)}
.boss.aktiv .badge{background:#d23a3a;color:#fff}
.bossrow{display:flex;align-items:center;gap:16px;margin-top:12px;flex-wrap:wrap}
.master{background:linear-gradient(135deg,rgba(20,184,166,.22),rgba(255,213,74,.08));border:1.5px dashed rgba(20,184,166,.85)}
.master .badge{background:#0d7f73;font-size:1.25rem}
.master .tag{color:#5eead4}
details{border:1.5px dashed var(--glasrand);border-radius:12px;padding:8px 14px;color:var(--leise)}
summary{cursor:pointer}
.lehrer{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
input[type=text]{font:inherit;border:2px solid var(--glasrand);background:rgba(0,0,0,.25);color:#fff;border-radius:10px;padding:8px 12px;width:12em;max-width:100%}
.msg{font-size:.9rem}
/* Spielfeld */
.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.bar .titel{font-weight:700}
.bar .titel small{display:block;font-weight:400;color:var(--leise);font-size:.85rem}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.35)}
.dot.ok{background:#3fd08a;border-color:#3fd08a} .dot.err{background:#ff6b6b;border-color:#ff6b6b} .dot.now{border-color:var(--gold);box-shadow:0 0 10px var(--gold)}
.dot.gelb{background:#ffd54a;border-color:#ffd54a}
.card{position:relative;background:var(--karte);color:var(--tinte);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.frage{font-size:1.3rem;font-weight:700;margin:0}
.fig{display:flex;justify-content:center}
.fig svg{width:100%;max-width:460px;height:auto}
.fig svg.mess{width:auto;max-width:none}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.opts button{font:inherit;cursor:pointer;padding:14px 10px;font-size:1.1rem;font-weight:700;border:2.5px solid var(--dunkel);border-radius:14px;background:#fff;color:var(--dunkel);box-shadow:0 4px 0 var(--dunkel);touch-action:manipulation}
.opts button:disabled{cursor:default}
.opts button.richtig{background:var(--okbg);border-color:var(--ok);color:var(--ok);box-shadow:0 4px 0 var(--ok)}
.opts button.falsch{background:var(--errbg);border-color:var(--err);color:var(--err);box-shadow:0 4px 0 var(--err)}
.opts button.gelb{background:#FFF3B0;border-color:#C99700;color:#7a5a00;box-shadow:0 4px 0 #C99700}
.fb{padding:12px 16px;font-weight:700;border-radius:12px}
.fb.ok{background:var(--okbg);color:var(--ok)} .fb.err{background:var(--errbg);color:var(--err)}
.fb.hinweis{background:#FFF3B0;color:#7a5a00}
.fb > span{display:block;font-weight:400;color:var(--tinte);margin-top:4px}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.ende{align-items:center;text-align:center}
.ende .gross{display:flex;gap:10px}
.ende .gross svg{width:64px;height:64px}
.ende .frage{color:var(--dunkel)}
.form{display:flex;flex-direction:column;gap:16px;font-size:1.25rem}
.glx{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.glx > span:first-child{font-weight:700}
.form input.fx{font:inherit;font-size:1.25rem;width:6em;text-align:center;border:2.5px solid var(--dunkel);border-radius:12px;padding:6px;color:#111;background:#fff}
.form input.fx.gelb{background:#FFF3B0;border-color:#C99700}
.form input.fx.gut{background:var(--okbg);border-color:var(--ok)}
.form input.fx.schlecht{background:var(--errbg);border-color:var(--err)}
.form .einheit{font-weight:700}
/* Einheiten-Knöpfe */
.ewahl{display:inline-flex;gap:6px;flex-wrap:wrap}
.eb{font:inherit;font-size:1.05rem;font-weight:700;cursor:pointer;min-width:3.2em;border:2.5px solid var(--dunkel);border-radius:10px;background:#fff;color:var(--dunkel);padding:6px 10px;box-shadow:0 3px 0 var(--dunkel);touch-action:manipulation}
.eb.an{background:#14b8a6;border-color:#0d7f73;color:#fff;box-shadow:0 3px 0 #0d7f73}
.ewahl.gelb .eb.an{background:#FFF3B0;border-color:#C99700;color:#7a5a00;box-shadow:0 3px 0 #C99700}
.ewahl.gut .eb.an{background:var(--okbg);border-color:var(--ok);color:var(--ok);box-shadow:0 3px 0 var(--ok)}
.ewahl.schlecht .eb.an{background:var(--errbg);border-color:var(--err);color:var(--err);box-shadow:0 3px 0 var(--err)}
.eb:disabled{cursor:default}
/* Produktbeschreibung im Online-Shop */
.shop{width:100%;max-width:440px;border:2px solid #e3ddd2;border-radius:16px;padding:14px 18px;background:#fbfaf7;color:#111;font-size:1rem;line-height:1.4}
.shop .tagS{font-size:.72rem;letter-spacing:.14em;color:#0d7f73;font-weight:700}
.shop h3{margin:4px 0 2px;font-size:1.15rem}
.shop .preis{color:#d9472b;font-weight:800;font-size:1.25rem}
.shop ul{margin:8px 0 10px;padding-left:20px}
.shop .vor{font:inherit;cursor:pointer;border:2px solid #0d7f73;background:#fff;color:#0d7f73;border-radius:999px;padding:4px 12px;font-weight:700;font-size:.9rem;touch-action:manipulation}
.shop .korb{display:inline-block;background:#e2a21b;color:var(--dunkel);font-weight:700;border-radius:999px;padding:5px 14px;font-size:.9rem}
/* Sternflug */
.flug{position:fixed;left:50%;top:45%;width:170px;height:170px;margin:-85px 0 0 -85px;z-index:50;pointer-events:none;filter:drop-shadow(0 0 25px rgba(255,213,74,.9))}
.glitzer{position:fixed;z-index:49;width:10px;height:10px;border-radius:50%;background:#fff3b0;pointer-events:none;box-shadow:0 0 12px #ffd54a}
.banner{background:linear-gradient(90deg,var(--gold),#ffe98a);color:var(--dunkel);font-weight:800;border-radius:14px;padding:10px 16px;text-align:center}
.fuss{text-align:right;color:var(--leise);font-size:.82rem;font-style:italic;margin:6px 0 0}
.fehlz{font-weight:700;font-size:.95rem;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.3);border-radius:999px;padding:5px 14px}
.fehlz.zuviel{background:#ff6b6b;border-color:#ff6b6b;color:#fff}
@media (max-width:640px){
  .bahn{grid-template-columns:repeat(2,minmax(0,1fr))}.bahn .linie{display:none}
  .levels{padding-left:0}.levels:before{display:none}.lv .badge{position:static;width:44px;height:44px;font-size:1.1rem;margin-bottom:8px}
  .kreis{width:72px;height:72px;font-size:1.3rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.vor2{font:inherit;cursor:pointer;border:2px solid #0d7f73;background:#fff;color:#0d7f73;border-radius:999px;padding:2px 10px;font-weight:700;font-size:.9rem}
</style>
<!-- Mathe-Base: Zurück-Knopf zur Trainer-Klassenseite -->
<style id="mb-zurueck-style">
#mb-leiste{display:block;width:100%;box-sizing:border-box;padding:8px 10px 6px;margin:0;text-align:left;position:relative;z-index:50}
#mb-zurueck{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:rgba(10,8,40,.9);color:#fff !important;border:1.5px solid rgba(94,228,255,.85);box-shadow:0 0 10px rgba(94,228,255,.45);font:700 14px/1 "Segoe UI",system-ui,-apple-system,sans-serif;text-decoration:none !important;letter-spacing:0;text-transform:none;cursor:pointer}
#mb-zurueck:hover{background:rgba(30,30,90,.95)}
#mb-zurueck:focus-visible{outline:3px solid #ffd166;outline-offset:3px}
@media print{#mb-leiste{display:none}}
</style>
<script id="mb-zurueck-script">
(function(){
  var K='mbTrainerKlasse', ziel='https://frauklugmann.github.io/trainer/';
  try{
    var m=(document.referrer||'').match(/^https:\/\/frauklugmann\.github\.io\/trainer\/(klasse\d+|oberstufe)\/?/);
    if(m){sessionStorage.setItem(K,'https://frauklugmann.github.io/trainer/'+m[1]+'/');}
    var s=sessionStorage.getItem(K); if(s){ziel=s;}
  }catch(e){}
  function einbauen(){
    if(document.getElementById('mb-leiste')) return;
    var leiste=document.createElement('div'); leiste.id='mb-leiste';
    var a=document.createElement('a'); a.id='mb-zurueck'; a.href=ziel;
    a.setAttribute('aria-label','Zurück zur Trainer-Übersicht deiner Klasse');
    a.textContent='← Zurück';
    leiste.appendChild(a);
    document.body.insertBefore(leiste, document.body.firstChild);
  }
  if(document.body){einbauen();}else{document.addEventListener('DOMContentLoaded',einbauen);}
})();
</script>

<script>
(function(){
/* Riffelrand der Golddublone */
(function(){let s="";for(let k=0;k<24;k++){const w=k*15,a=w*Math.PI/180;s+=`<rect x="-5" y="-8" width="10" height="16" rx="3" transform="translate(${(150+116*Math.cos(a)).toFixed(1)} ${(150+116*Math.sin(a)).toFixed(1)}) rotate(${w})" fill="#ffd84d" stroke="#3a2200" stroke-width="2.5"/>`;}
  document.getElementById("riffel").innerHTML=s;})();

/* ================= Daten ================= */
const KEY="trainer-dreiecke-vierecke-v1", CODE_H=1428710757, RUNDE=10, FEHLER_ERLAUBT=2;
const erlaubt=n=>n<=5?1:FEHLER_ERLAUBT; /* kurze Runden (5 Sachaufgaben): nur 1 Fehler */
const codeHash=t=>{let h=5381;for(const c of t)h=(h*33^c.charCodeAt(0))>>>0;return h;};
const LEVELS=[
  {nr:1,name:"Das Rechteck",spiele:[
    {id:"1a",nr:"1-1",name:"Umfang und Flächeninhalt",gen:g11},
    {id:"1b",nr:"1-2",name:"Flächeneinheiten umrechnen",gen:g12},
    {id:"1c",nr:"1-3",name:"Fehlende Seite",gen:g13},
    {id:"1d",nr:"1-4",name:"Sachaufgaben",gen:g14,runde:5}]},
  {nr:2,name:"Das Parallelogramm",spiele:[
    {id:"2a",nr:"2-1",name:"Erkennen",gen:g21},
    {id:"2b",nr:"2-2",name:"Flächeninhalt",gen:g22},
    {id:"2c",nr:"2-3",name:"Fehlende Größe",gen:g23},
    {id:"2d",nr:"2-4",name:"Sachaufgaben",gen:g24,runde:5}]},
  {nr:3,name:"Das Dreieck",spiele:[
    {id:"3a",nr:"3-1",name:"Winkelarten",gen:g31},
    {id:"3b",nr:"3-2",name:"Dreiecke einteilen",gen:g32},
    {id:"3c",nr:"3-3",name:"Flächeninhalt",gen:g33},
    {id:"3d",nr:"3-4",name:"Sachaufgaben",gen:g34,runde:5}]},
  {nr:4,name:"Das Trapez",spiele:[
    {id:"4a",nr:"4-1",name:"Trapez und Höhe",gen:g41},
    {id:"4b",nr:"4-2",name:"Fläche und Umfang",gen:g42},
    {id:"4c",nr:"4-3",name:"Sachaufgaben",gen:g43,runde:5},
    {id:"4d",nr:"4-4 ★",name:"Raute und Drachen",gen:g44,opt:true,hinweis:"Nur fürs LH 1 · freiwillig"}]},
  {nr:5,name:"Zusammengesetzte Figuren",spiele:[
    {id:"5a",nr:"5-1",name:"Umfang",gen:g51},
    {id:"5b",nr:"5-2",name:"Zerlegen",gen:g52},
    {id:"5c",nr:"5-3",name:"Ergänzen",gen:g53},

/* rechter Winkel: Kreisbogen mit Punkt · gleich lange Seiten: zwei Striche */
function eckBogen(cx,cy,dx,dy){const r=16,s=dx*dy>0?1:0;

  const x0=Math.round(190-w/2),y0=16,x1=x0+w,y1=y0+h,mx=(x0+x1)/2,my=(y0+y1)/2;
  let s=`<svg viewBox="0 0 460 ${h+64}" role="img" aria-label="${o.quad?"Quadrat":"Rechteck"}"><rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="#e6f7f4" stroke="#111" stroke-width="3"/>`;
  s+=eckBogen(x0,y1,1,-1)+eckBogen(x1,y1,-1,-1)+eckBogen(x0,y0,1,1)+eckBogen(x1,y0,-1,1);
  if(o.quad){
    const tH=(x,y)=>`<line x1="${x-4}" y1="${y-8}" x2="${x-4}" y2="${y+8}" stroke="#111" stroke-width="2.5"/><line x1="${x+4}" y1="${y-8}" x2="${x+4}" y2="${y+8}" stroke="#111" stroke-width="2.5"/>`;
    const tV=(x,y)=>`<line x1="${x-8}" y1="${y-4}" x2="${x+8}" y2="${y-4}" stroke="#111" stroke-width="2.5"/><line x1="${x-8}" y1="${y+4}" x2="${x+8}" y2="${y+4}" stroke="#111" stroke-width="2.5"/>`;
    s+=tH(mx,y0)+tH(mx,y1)+tV(x0,my)+tV(x1,my);}
  s+=`<text x="${mx}" y="${y1+36}" text-anchor="middle" font-size="21" font-weight="700" fill="#111">${o.la}</text>`;
  if(!o.quad&&o.lb)s+=`<text x="${x1+14}" y="${my+7}" font-size="21" font-weight="700" fill="#111">${o.lb}</text>`;
  if(o.mitte)s+=`<text x="${mx}" y="${my+(o.quad?-16:7)}" text-anchor="middle" font-size="19" font-weight="700" fill="#0d5f57" stroke="#e6f7f4" stroke-width="5" paint-order="stroke">${o.mitte}</text>`;

/* 1-1 Umfang und Flächeninhalt: 0★ ganze Zahlen, gleiche Einheit · 1★ Kommazahlen · 2★ verschiedene Längeneinheiten, Ergebniseinheit vorgegeben */
const PAAR=[["m","cm",100,[1.2,1.5,2,0.8,2.5,1.6],[40,50,60,80,30,25],[30,40,50,60,80]],["cm","mm",10,[6,9,12,5,7],[25,45,15,55,65],[20,30,40,50,60]],

/* 1-2 Flächeneinheiten umrechnen: 0★ benachbarte Einheiten, ganze Zahlen · 1★ über zwei Stufen, Kommazahlen · 2★ mit a, ha, km² und „sinnvolle Einheit“ */
const FE=["mm²","cm²","dm²","m²","a","ha","km²"];
const conv=(v,a,b)=>rund(v*Math.pow(100,FE.indexOf(a)-FE.indexOf(b)));

const UMR2=[[6000,"m²","a"],[4,"ha","m²"],[0.5,"ha","a"],[250,"a","ha"],[2,"km²","ha"],[800,"m²","a"],[1.5,"ha","m²"],[40000,"m²","ha"],[7,"a","m²"],[350,"ha","km²"],[0.2,"km²","ha"],[12,"ha","a"]];

 {t:"Ein Landkreis ist 80 000 ha groß.",v:80000,u:"ha",ok:["km²"],w:"Landkreise und Länder gibt man in km² an."}];

const PASST=[["ein Kinderzimmer","m²"],["einen Kleingarten","a"],["ein Weizenfeld","ha"],["ein Waldstück im Forst","ha"],["einen Landkreis","km²"],
  ["eine Briefmarke","cm²"],["eine Wohnung","m²"],["ein Tablet-Display","cm²"],["eine Stadt","km²"],["ein Baugrundstück","a"]];
const MERK="Wohnungen und Zimmer in m² · a für Grundstücke und Kleingärten · ha für Felder, Wald und Parks · km² für Städte, Landkreise und Länder.";
function passt(){
  const [x,u]=pick(PASST), weg=u==="a"?["m²"]:[];

  if(lv===0){const i=rnd(1,3),n=rnd(2,99);return rnd(0,1)?umr(n,FE[i],FE[i-1]):umr(n*100,FE[i-1],FE[i]);}

/* 1-3 Fehlende Seite (durch Überlegen, ohne Umstellen): 0★ aus A · 1★ aus u (halber Umfang) und Quadrat · 2★ gemischt, verschiedene Einheiten */
const seiteFeld=(lab,n,T,o2)=>({label:lab+" =",ok:[[n,T]],units:wahl(T,o2)});
function ausA(A,g,res,T,o){ /* A und eine Seite gegeben, andere Seite gesucht */

function quadA(A,a,T){
  return{q:`Quadrat: A = ${L(A,QU(T))}. Berechne die Seitenlänge a.`,svg:rechteck({la:"a = ?",quad:true,mitte:"A = "+L(A,QU(T))}),

function g13(lv){
  const T=pick(["cm","m"]);

  if(t===1){let a,b;do{a=pick([40,60,80,30,70]);b=pick([20,50,90,110,40]);}while(a===b);

/* ================= Level 2 · Das Parallelogramm ================= */
/* Zeichnungen nach der Arbeitsblattvorlage: Ecken A, B, C, D gegen den Uhrzeigersinn (A links unten), rechter Winkel mit Bogen und Punkt,
   gleich lange Seiten mit Strichen. Gerechnet wird in „Mathe-Koordinaten“ (y nach oben); erst beim Zeichnen wird in Bildschirmkoordinaten umgerechnet. */
const vsub=(p,q)=>[p[0]-q[0],p[1]-q[1]], vadd=(p,q)=>[p[0]+q[0],p[1]+q[1]], vmul=(p,k)=>[p[0]*k,p[1]*k];
const vlen=p=>Math.hypot(p[0],p[1]), vnorm=p=>{const l=vlen(p)||1;return[p[0]/l,p[1]/l];};
const vrot=(p,w)=>{const c=Math.cos(w),s=Math.sin(w);return[p[0]*c-p[1]*s,p[0]*s+p[1]*c];};
const sp2=p=>p[0].toFixed(1)+" "+p[1].toFixed(1);
function szene(W,H,pts,zeichne){
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]), minx=Math.min(...xs), maxx=Math.max(...xs), miny=Math.min(...ys), maxy=Math.max(...ys);
  const mx=12, my=46, k=Math.min(1,(W-2*mx)/Math.max(1,maxx-minx),(H-2*my)/Math.max(1,maxy-miny)), cx=(minx+maxx)/2, cy=(miny+maxy)/2;
  const T=p=>[W/2+(p[0]-cx)*k,H/2-(p[1]-cy)*k];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Zeichnung">`+zeichne(T)+`</svg>`;}
const sLine=(a,b,st,w,dash)=>`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="${st||"#111"}" stroke-width="${w||3}"${dash?` stroke-dasharray="${dash}"`:""} stroke-linecap="round"/>`;
/* Text neben einem Bildschirmpunkt p; dir = Richtung in Mathe-Koordinaten, d = Abstand in Pixeln */
function sText(p,dir,d,t,o){
  o=o||{};const q=[p[0]+dir[0]*d,p[1]-dir[1]*d], an=o.anchor||(dir[0]>.35?"start":dir[0]<-.35?"end":"middle");
  return `<text x="${q[0].toFixed(1)}" y="${q[1].toFixed(1)}" dy=".35em" text-anchor="${an}" font-size="${o.size||21}" font-weight="700" fill="${o.fill||"#111"}"${o.halo?` stroke="${o.halo}" stroke-width="5" paint-order="stroke"`:""}>${t}</text>`;}
/* rechter Winkel: Kreisbogen mit Punkt; v Bildschirmpunkt, u1 und u2 Bildschirm-Richtungen der beiden Schenkel */
function sRw(v,u1,u2,r){
  r=r||15;const a1=Math.atan2(u1[1],u1[0]), a2=Math.atan2(u2[1],u2[0]);let d=a2-a1;while(d>Math.PI)d-=2*Math.PI;while(d<=-Math.PI)d+=2*Math.PI;
  const sw=d>0?1:0, p1=[v[0]+u1[0]*r,v[1]+u1[1]*r], p2=[v[0]+u2[0]*r,v[1]+u2[1]*r], c=[v[0]+(u1[0]+u2[0])*r*.42,v[1]+(u1[1]+u2[1])*r*.42];
  return `<path d="M${sp2(p1)}A${r} ${r} 0 0 ${sw} ${sp2(p2)}" fill="none" stroke="#111" stroke-width="2"/><circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="2.4" fill="#111"/>`;}
/* gleich lange Seiten: n Striche quer über die Mitte der Seite a-b (Bildschirmpunkte) */
function sTicks(a,b,n){
  const mid=[(a[0]+b[0])/2,(a[1]+b[1])/2], d=vnorm(vsub(b,a)), nr=[-d[1],d[0]];let s="";
  for(let i=0;i<n;i++){const o=(i-(n-1)/2)*7, c=[mid[0]+d[0]*o,mid[1]+d[1]*o];
    s+=sLine([c[0]-nr[0]*8,c[1]-nr[1]*8],[c[0]+nr[0]*8,c[1]+nr[1]*8],"#111",2.5);}
  return s;}
const sv=u=>[u[0],-u[1]];

/* Parallelogramm ABCD (A links unten, gegen den Uhrzeigersinn). W Grundseite, h Höhe, s Versatz von D gegenüber A (in Pixeln, rechnerisch), rot = Drehung.
   Optionen: gl/hl/sl Beschriftungen · mitte Text im Parallelogramm · hoehe (Höhe von D samt rechtem Winkel) · grund (Grundseite AB fett)
   · V "C" oder "D", Fx: Strecken V-E (Lot) und V-F zum Auswählen */
function zeichnePara(o){
  const W=o.W, h=o.h, s=o.s, w=o.rot||0, R=p=>vrot(p,w), H=o.H||250;
  const P={A:R([0,0]),B:R([W,0]),C:R([W+s,h]),D:R([s,h])}, poly=[P.A,P.B,P.C,P.D];
  const cen=vmul(vadd(vadd(P.A,P.B),vadd(P.C,P.D)),.25), b=vnorm(vsub(P.B,P.A)), nUp=[-b[1],b[0]];
  const pts=poly.slice(), hasV=!!o.V, Ex=o.V==="C"?W+s:s, E=hasV?R([Ex,0]):null, F=o.Fx!=null?R([o.Fx,0]):null, V=hasV?R(o.V==="C"?[W+s,h]:[s,h]):null;
  const xs=[0,W,Ex,o.Fx].filter(x=>x!=null), x0=Math.min(...xs), x1=Math.max(...xs);
  const extL=hasV&&x0<-.5?[R([x0,0]),P.A]:null, extR=hasV&&x1>W+.5?[P.B,R([x1,0])]:null;
  [E,F,extL&&extL[0],extR&&extR[1]].forEach(p=>{if(p)pts.push(p);});
  const links=hasV&&Ex<0;                                   /* Fußpunkt links außerhalb: Beschriftung der Höhe links */
  if(o.hl&&links)pts.push(R([Ex-92,h/2]));
  if(o.sl)pts.push(R([W+s/2+70,h/2]));
  return szene(460,H,pts,T=>{
    const a=T(P.A), bb=T(P.B), c=T(P.C), d=T(P.D); let g="";
    g+=`<polygon points="${[a,bb,c,d].map(sp2).join(" ")}" fill="#e6f7f4" stroke="#111" stroke-width="3" stroke-linejoin="round"/>`;
    if(extL)g+=sLine(T(extL[0]),T(extL[1]),"#111",1.8,"6 5");
    if(extR)g+=sLine(T(extR[0]),T(extR[1]),"#111",1.8,"6 5");
    if(o.grund)g+=sLine(a,bb,"#0d5f57",6);
    if(o.hoehe&&hasV){
      g+=sLine(T(V),T(E),"#111",2.5,"7 5");
      const sg=(W/2-Ex)>=0?1:-1, dirB=sv(b), u2=sg>0?dirB:[-dirB[0],-dirB[1]], up=vnorm(vsub(T(V),T(E)));
      g+=sRw(T(E),up,u2);
    }
    if(o.cand){g+=sLine(T(V),T(E),"#111",3)+sLine(T(V),T(F),"#111",3)+`<circle cx="${T(E)[0].toFixed(1)}" cy="${T(E)[1].toFixed(1)}" r="3.6" fill="#111"/><circle cx="${T(F)[0].toFixed(1)}" cy="${T(F)[1].toFixed(1)}" r="3.6" fill="#111"/>`;}
    /* Ecken */
    for(const n of ["A","B","C","D"]){const dir=vnorm(vsub(P[n],cen));g+=sText(T(P[n]),dir,19,n,{size:20});}
    if(o.cand){const out=[-nUp[0],-nUp[1]];g+=sText(T(E),out,19,o.nE||"E",{size:20})+sText(T(F),out,19,o.nF||"F",{size:20});}
    zeichnePara.last={A:T(P.A),B:T(P.B),C:T(P.C),D:T(P.D),V:hasV?T(V):null,E:hasV?T(E):null,F:F?T(F):null};
    /* Maße */
    if(o.gl){const mid=vmul(vadd(P.A,P.B),.5);g+=sText(T(mid),[-nUp[0],-nUp[1]],28,o.gl);}
    if(o.sl){const mid=vmul(vadd(P.B,P.C),.5), dir=vnorm(vsub(mid,cen));g+=sText(T(mid),dir,16,o.sl);}
    if(o.hl&&hasV){const mid=vmul(vadd(V,E),.5);g+=links?sText(T(mid),[-b[0],-b[1]],10,o.hl,{anchor:"end"}):sText(T(R([Ex,h*.32])),b,10,o.hl,{anchor:"start",halo:"#e6f7f4"});}
    if(o.mitte){g+=links?sText(T(R([W/2+s/2,h*.5])),[0,0],0,o.mitte,{anchor:"middle",size:19,fill:"#0d5f57",halo:"#e6f7f4"}):sText(T(R([Ex,h*.72])),b,10,o.mitte,{anchor:"start",size:19,fill:"#0d5f57",halo:"#e6f7f4"});}
    return g;});
}

/* Welche Strecke ist die Höhe? Gedreht; die Höhe liegt innen oder außen (dann wird die Grundseite gestrichelt verlängert) */
function hoeheAufg(aussenChance){
  const W=rnd(180,210), h=rnd(88,104), V=pick(["D","C"]), aussen=Math.random()<aussenChance, r=(x,y)=>rnd(Math.round(x),Math.round(y));
  const ov=r(.6*h,.85*h), inn=r(.6*h,Math.min(W-.6*h,1.1*h));
  /* V = D: Lot von D; außen liegt der Fußpunkt links von A (D springt über A hinaus). V = C: Lot von C; außen liegt der Fußpunkt rechts von B */
  const s=V==="D"?(aussen?-ov:inn):(aussen?ov:-inn);
  const Ex=V==="D"?s:W+s;
  /* falscher Fußpunkt F: aus allen passenden Stellen auswählen (genug Abstand zu A, B und zum richtigen Fußpunkt) */
  const kand=[];for(let x=Math.round(Ex-1.9*h);x<=Ex+1.9*h;x+=2){const d=Math.abs(x-Ex);if(d>=.6*h&&Math.abs(x)>=.5*h&&Math.abs(x-W)>=.5*h&&x>=-W&&x<=2*W)kand.push(x);}
  const Fx=kand.length?pick(kand):Ex+(Ex<W/2?1:-1)*h;
  const rot=rnd(0,359)*Math.PI/180, nb=V==="D"?"A":"B", innen=Ex>0&&Ex<W;
  const [nE,nF]=shuffle(["E","F"]);                       /* die richtige Strecke heißt mal VE, mal VF */
  const svg=zeichnePara({W,h,s,rot,V,Fx,cand:true,grund:true,H:300,nE,nF});
  const richtig=V+nE, falsch=V+nF;
  return Object.assign(mc(`Welche Strecke ist die Höhe des Parallelogramms zur Grundseite AB?`,svg,"Strecke "+richtig,["Strecke "+falsch,"Strecke "+V+nb],
    `Die Höhe steht senkrecht (im rechten Winkel) auf der Grundseite. Das ist die Strecke ${richtig}.<br>${V}${nb} ist eine schräge Seite, ${falsch} steht nicht senkrecht auf AB.${innen?"":"<br>Hier liegt die Höhe außerhalb des Parallelogramms: Die Grundseite wird dafür verlängert (gestrichelt)."}`),{kat:richtig,geo:zeichnePara.last,chk:{V,nE}});}

let R=null, letzte="";
const schluessel=a=>a.key||a.q+"|"+(a.svg||"").replace(/<li>[^<]*<\/li>/g,"").replace(/ data-vor="[^"]*"/g,"")+"|"+(a.opts?a.opts.slice().sort().join("/"):a.loes);
function start(id){
  zahlEl.textContent=summe();
  const spiel=id==="m"?BOSS:id==="M"?MASTER:ALLE.find(t=>t.id===id);
  const lv=Math.min(2,stars(id));
  R={spiel,id,lv,n:spiel.runde||RUNDE,i:0,res:[],aufgaben:[]};
  const seen=new Set();let versuche=0;
  const kat=a=>a.kat||(a.opts?a.opts[a.ans]:a.q);

const punkte=()=>`<div class="dots" aria-label="Fortschritt">${R.aufgaben.map((_,i)=>`<span class="dot ${R.res[i]===true?"ok":R.res[i]==="gelb"?"gelb":R.res[i]===false?"err":i===R.i?"now":""}"></span>`).join("")}</div>`;

function kopf(){

function feedback(ok,a){

function geschafftText(){const f=R.res.filter(x=>x===false).length,z=R.res.filter(x=>x==="gelb").length;
  const zt=z?`${z} ${z===1?"Zweitversuch":"Zweitversuchen"}`:"";

    <div class="row"><button class="btn" id="noch">${neuStern&&s<3?"Nächste Runde (schwerer) ▶":"Noch eine Runde ▶"}</button><button class="btn hell" id="heim" style="color:#3b2412;background:#f3ede2;box-shadow:0 5px 0 #cbb89a">Zur Übersicht</button></div></section>`;

function muenzFlug(fertig){

<script>/* ===== Geodreieck (frei beweglich, drehbar, rastet an Linien ein, 0 auf dem Scheitel) ===== */
(()=>{

const pid=()=>'t'+(document.querySelector('#app .frage')||{}).textContent;
function pageXY(svg,x,y){const m=svg.getScreenCTM();return{x:m.a*x+m.c*y+m.e+scrollX,y:m.b*x+m.d*y+m.f+scrollY}}
function segs(){const S=[],V=[];

    for(const l of svg.querySelectorAll('line')){const p=pageXY(svg,+l.getAttribute('x1'),+l.getAttribute('y1')),q=pageXY(svg,+l.getAttribute('x2'),+l.getAttribute('y2'));if(len(sub(q,p))>20){S.push({p,q,d:unit(sub(q,p))});V.push(p,q)}}

  return{S,V}}
function magnet(){
  g.x=g.rx;g.y=g.ry;g.a=g.ra;g.snap=null;g.V=null;const C={x:g.rx,y:g.ry};let best=null;const {S,V}=segs();
  for(const s of S){const ang=deg(Math.atan2(s.d.y,s.d.x)),dl=Math.abs(cross(sub(C,s.p),s.d));if(dl>16)continue;
    if(d180(g.ra,ang)<6&&(!best||dl<best.dl))best={dl,k:'kante',s,ta:near180(g.ra,ang)};
    if(d180(g.ra+90,ang)<6&&(!best||dl<best.dl))best={dl,k:'mitte',s,ta:near180(g.ra,ang-90)};}
  if(!best)return;let c=add(best.s.p,mul(best.s.d,dot(sub(C,best.s.p),best.s.d)));const s=best.s;
  if(best.k==='kante'){for(const v of V){if(Math.abs(cross(sub(v,s.p),s.d))>3)continue;const off=dot(sub(v,c),s.d);if(Math.abs(off)<16){c=add(c,mul(s.d,off));best.k='null';break}}}
  else{for(const v of V){if(Math.abs(cross(sub(v,s.p),s.d))<3)continue;const off=dot(sub(v,c),s.d);if(Math.abs(off)<16){c=add(c,mul(s.d,off));best.k='hoehe';g.V=v;g.F=c;break}}}
  g.x=c.x;g.y=c.y;g.a=best.ta;g.snap=best.k;}
function el(t,a,p,txt){if(t==='text'&&p!==LG&&a.x!=null)a.transform=`rotate(${-g.a} ${a.x} ${a.y-4})`;const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;p.appendChild(e);return e}
function groesse(){ov.setAttribute('width',document.documentElement.scrollWidth);ov.setAttribute('height',document.documentElement.scrollHeight)}
function zeichne(){
  groesse();LG.innerHTML='';GG.innerHTML='';
  for(const h of linien[pid()]||[])el('line',{x1:h.p.x,y1:h.p.y,x2:h.q.x,y2:h.q.y,stroke:'#C2410C','stroke-width':3,'stroke-dasharray':'9 6'},LG);
  btn.classList.toggle('an',on);
  if(!on){hint.classList.remove('on');return}
  const G=el('g',{transform:`translate(${g.x} ${g.y}) rotate(${g.a})`},GG);
  el('polygon',{class:'grip',points:`${-L},0 ${L},0 0,${L}`,fill:'rgba(190,232,240,0.55)',stroke:'#0a6e6e','stroke-width':2},G);
  const kante=g.snap==='kante'||g.snap==='null',mitte=g.snap==='mitte'||g.snap==='hoehe';
  for(let k=-80;k<=80;k++){const x=k*MM,l=k%10===0?16:k%5===0?11:6;el('line',{x1:x,y1:0,x2:x,y2:l,stroke:'#0b3b3b','stroke-width':k%10===0?1.4:.8},G);
    if(k%10===0)el('text',{x,y:31,'text-anchor':'middle','font-size':14,fill:'#0b3b3b','font-family':'Arial'},G,String(Math.abs(k/10)));}
  el('text',{x:4.5*CM,y:48,'text-anchor':'middle','font-size':12,fill:'#0b3b3b','font-family':'Arial'},G,'cm');
  el('path',{d:`M${R} 0 A${R} ${R} 0 0 1 ${-R} 0`,fill:'none',stroke:'rgba(10,110,110,.6)'},G);
  for(let t=5;t<180;t+=5){const c=Math.cos(rad(t)),s=Math.sin(rad(t)),l=t%10===0?13:7;el('line',{x1:R*c,y1:R*s,x2:(R-l)*c,y2:(R-l)*s,stroke:'#0b3b3b','stroke-width':1},G);
    if(t%10===0&&t!==90){el('text',{x:(R-24)*c,y:(R-24)*s+4,'text-anchor':'middle','font-size':10,fill:'#0b3b3b','font-family':'Arial'},G,String(180-t));
      el('text',{x:(R-40)*c,y:(R-40)*s+4,'text-anchor':'middle','font-size':9,fill:'#7a1d00','font-family':'Arial'},G,String(t));}}
  el('text',{x:0,y:R-26,'text-anchor':'middle','font-size':11,fill:'#0b3b3b','font-family':'Arial'},G,'90');
  el('line',{x1:0,y1:0,x2:0,y2:L-70,stroke:mitte?'#2e7d32':'#0b3b3b','stroke-width':mitte?4:1.5},G);
  if(kante)el('line',{x1:-L,y1:0,x2:L,y2:0,stroke:'#2e7d32','stroke-width':4},G);
  el('circle',{cx:0,cy:0,r:4,fill:'#C62828'},G);
  el('circle',{class:'knopf',cx:0,cy:L-42,r:20,fill:'#0f9e9e',stroke:'#fff','stroke-width':3},G);
  el('text',{x:0,y:L-34,'text-anchor':'middle','font-size':22,fill:'#fff','pointer-events':'none'},G,'↻');
  const t={null:'0 liegt auf dem Scheitel – jetzt ablesen!',kante:'Die Kante liegt an. Schiebe die 0 auf die Ecke.',mitte:'Mittellinie auf der Grundseite – schiebe, bis die Kante die Ecke berührt.',hoehe:'Rechter Winkel! Jetzt kannst du h einzeichnen.'}[g.snap];
  hint.classList.toggle('on',!!t||(linien[pid()]||[]).length>0);$('#geotxt').textContent=t||'Ziehe das Geodreieck an eine Linie.';
  $('#geoh').style.display=g.snap==='hoehe'?'':'none';$('#geohx').style.display=(linien[pid()]||[]).length?'':'none';}
function pt(e){return{x:e.pageX,y:e.pageY}}
ov.addEventListener('pointerdown',e=>{const k=e.target.classList;if(!k.contains('grip')&&!k.contains('knopf'))return;e.preventDefault();ov.setPointerCapture(e.pointerId);
  const p=pt(e);drag=k.contains('knopf')?{t:'rot',s:deg(Math.atan2(p.y-g.y,p.x-g.x)),a0:g.a}:{t:'mov',o:sub({x:g.x,y:g.y},p)};g.rx=g.x;g.ry=g.y;g.ra=g.a;});
ov.addEventListener('pointermove',e=>{if(!drag)return;const p=pt(e);
  if(drag.t==='mov'){g.rx=p.x+drag.o.x;g.ry=p.y+drag.o.y}else{g.ra=drag.a0+deg(Math.atan2(p.y-g.y,p.x-g.x))-drag.s;g.rx=g.x;g.ry=g.y}
  magnet();zeichne();});
ov.addEventListener('pointerup',()=>{drag=null});
btn.addEventListener('click',()=>{on=!on;if(on){const r=$('#app svg.mess')||$('#app');const b=r.getBoundingClientRect();g.rx=g.x=b.left+scrollX+b.width/2;g.ry=g.y=b.top+scrollY+40;g.ra=g.a=0;g.snap=null}zeichne();});
$('#geoh').addEventListener('click',()=>{if(g.snap!=='hoehe')return;(linien[pid()]=linien[pid()]||[]).push({p:{...g.V},q:{...g.F}});zeichne();});
$('#geohx').addEventListener('click',()=>{linien[pid()]=[];zeichne();});
new MutationObserver(()=>{const da=!!document.querySelector('#app svg.mess');btn.style.display=da?'':'none';if(!da&&on){on=false;zeichne();}}).observe(document.getElementById('app'),{childList:true,subtree:true});btn.style.display='none';
addEventListener('resize',()=>{for(const k in linien)linien[k]=[];zeichne()});

zeichne();
})();
